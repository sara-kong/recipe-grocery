<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<title>Groceries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2ec;
    --surface: #ffffff;
    --ink: #1d2620;
    --muted: #5f6b63;
    --line: #d6ddd5;
    --basil: #2c6e49;
    --basil-ink: #ffffff;
    --tomato: #b8402a;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a17;
      --surface: #1e2521;
      --ink: #e8eee9;
      --muted: #9aa69e;
      --line: #2f3833;
      --basil: #6fc48f;
      --basil-ink: #10241a;
      --tomato: #f08a72;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 28px 0 8px; text-transform: capitalize; }
  .sub { color: var(--muted); margin: 6px 0 0; }
  a { color: var(--basil); font-weight: 600; text-decoration: none; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--basil); outline-offset: 2px; }
  .ghost:focus-within { outline: 3px solid var(--basil); outline-offset: 2px; }

  .tools { display: flex; gap: 8px; margin: 18px 0 20px; }
  .ghost {
    background: transparent; color: var(--basil); border: 1.5px solid var(--basil);
    border-radius: 999px; padding: 8px 14px; font-weight: 600; white-space: nowrap; cursor: pointer;
  }
  .small { padding: 5px 11px; font-size: 14px; }
  .back { background: none; border: 0; color: var(--basil); font-weight: 600; padding: 0; margin-bottom: 14px; }

  .rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; overflow: hidden; }
  .rows li + li { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 64px; }
  .row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--basil); flex: none; margin: 0; }
  .check { display: flex; align-items: center; padding: 14px 4px 14px 16px; margin: -14px 0 -14px -16px; align-self: stretch; }
  .open {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px;
    background: none; border: 0; padding: 0; color: inherit; text-align: left;
  }
  .protein { flex: none; width: 58px; }
  .protein b { display: block; font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--tomato); }
  .protein span { font-size: 12px; color: var(--muted); }
  .title { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; }
  .item-meta { color: var(--muted); font-size: 13px; }
  .have { color: var(--muted); font-size: 13px; flex: none; }
  li.done .item-name { text-decoration: line-through; color: var(--muted); }
  li.owned .item-name { color: var(--muted); }
  .row-actions { display: flex; gap: 6px; flex: none; }

  .hero-protein { margin: 4px 0 14px; }
  .hero-protein b { font-size: 56px; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; color: var(--tomato); }
  .hero-protein span { display: block; color: var(--muted); font-size: 14px; }
  .steps { background: var(--surface); border-radius: 14px; margin: 0; padding: 14px 16px 14px 40px; }
  .steps li + li { margin-top: 10px; }
  .detail-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
  .danger { background: none; border: 0; color: var(--tomato); font-weight: 600; padding: 10px; }

  .add-form { background: var(--surface); border-radius: 14px; padding: 14px 16px; margin-top: 20px; display: grid; gap: 12px; }
  .add-form input[type=text] {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px;
    background: var(--bg); color: var(--ink); font-size: 16px;
  }
  .add-form label { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .add-form input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--basil); margin: 0; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .primary {
    display: block; width: 100%; max-width: 528px; margin: 0 auto;
    background: var(--basil); color: var(--basil-ink); border: 0; border-radius: 14px;
    padding: 16px; font-size: 17px; font-weight: 700;
  }
  .primary:disabled { opacity: 0.4; }
  .empty, .note { background: var(--surface); border-radius: 14px; padding: 18px 16px; color: var(--muted); }
  .note { margin-bottom: 16px; color: var(--ink); }
  .note.error { color: var(--tomato); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="status" class="note" role="status" hidden></div>

  <section id="pick">
    <h1>What are you cooking?</h1>
    <p class="sub">Pick recipes, get one list of what you’re missing.</p>
    <div class="tools">
      <button class="ghost" data-go="pantry">Pantry</button>
      <label class="ghost" for="upload">Add receipt</label>
      <input id="upload" type="file" accept="image/*" multiple hidden>
    </div>
    <ul id="recipes" class="rows"></ul>
  </section>

  <section id="detail" hidden>
    <button class="back" data-go="pick">‹ Recipes</button>
    <div id="detail-body"></div>
  </section>

  <section id="list" hidden>
    <button class="back" data-go="pick">‹ Recipes</button>
    <h1 id="list-title">Your list</h1>
    <p class="sub" id="list-sub"></p>
    <div id="aisles"></div>
  </section>

  <section id="pantry" hidden>
    <button class="back" data-go="pick">‹ Recipes</button>
    <h1>Pantry</h1>
    <p class="sub">What you have at home. Anything here stays off your list.</p>
    <form id="pantry-form" class="add-form">
      <input id="pantry-input" type="text" placeholder="eggs, rice, spinach" autocomplete="off" aria-label="Items to add">
      <label><input id="pantry-staple" type="checkbox"> Staple (I always have it)</label>
      <button class="primary" type="submit">Add to pantry</button>
    </form>
    <div id="pantry-items"></div>
  </section>
</main>

<div class="bar" id="bar">
  <button class="primary" id="make" disabled>Make list</button>
</div>

<script>
const KEY = new URLSearchParams(location.search).get("key") || "";
const $ = (id) => document.getElementById(id);

async function api(path, opts = {}) {
  const sep = path.includes("?") ? "&" : "?";
  const res = await fetch(path + (KEY ? sep + "key=" + encodeURIComponent(KEY) : ""), opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `Request failed (${res.status})`);
  return body;
}
const jsonBody = (method, data) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });

const store = {
  get(k, fallback) { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const matchKey = (n) => { n = String(n).toLowerCase().trim(); return n.endsWith("s") ? n.slice(0, -1) : n; };
const fmtAmount = (q, u) => (q == null ? "" : `${+Number(q).toFixed(2)} ${u || ""}`.trim());

function showStatus(text, isError = false) {
  const el = $("status");
  el.textContent = text;
  el.classList.toggle("error", isError);
  el.hidden = !text;
}

function show(view) {
  for (const v of ["pick", "detail", "list", "pantry"]) $(v).hidden = v !== view;
  $("bar").hidden = view !== "pick";
  window.scrollTo(0, 0);
}

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (!go) return;
  showStatus("");
  if (go.dataset.go === "pick") { loadRecipes(); show("pick"); }
  if (go.dataset.go === "pantry") { loadPantry(); show("pantry"); }
});

/* ---------- Recipes ---------- */

let selected = new Set(store.get("selected", []));

function updateMakeButton() {
  const n = selected.size;
  $("make").disabled = n === 0;
  $("make").textContent = n ? `Make list for ${n} recipe${n > 1 ? "s" : ""}` : "Make list";
}

async function loadRecipes() {
  let recipes;
  try {
    recipes = await api("/recipes");
  } catch (e) {
    $("recipes").innerHTML = `<li class="empty">${esc(e.message)}</li>`;
    return;
  }
  const ids = new Set(recipes.map((r) => r.id));
  selected = new Set([...selected].filter((id) => ids.has(id)));
  store.set("selected", [...selected]);

  $("recipes").innerHTML = recipes.length
    ? recipes.map((r) => `
      <li class="row">
        <label class="check"><input type="checkbox" data-id="${r.id}" ${selected.has(r.id) ? "checked" : ""}
          aria-label="Add ${esc(r.title)} to this week’s list"></label>
        <button class="open" data-open="${r.id}">
          <span class="protein"><b>${Math.round(r.protein_per_serving_g || 0)}g</b><span>protein</span></span>
          <span class="title"><span class="item-name">${esc(r.title)}</span><br>
            <span class="item-meta">View recipe</span></span>
        </button>
      </li>`).join("")
    : `<li class="empty">No recipes yet. Share a TikTok to the Add Recipe shortcut and it’ll show up here.</li>`;
  updateMakeButton();
}

$("recipes").addEventListener("change", (e) => {
  const id = Number(e.target.dataset.id);
  e.target.checked ? selected.add(id) : selected.delete(id);
  store.set("selected", [...selected]);
  updateMakeButton();
});

$("recipes").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-open]");
  if (btn) openRecipe(Number(btn.dataset.open));
});

/* ---------- Recipe detail ---------- */

async function openRecipe(id, keepStatus = false) {
  if (!keepStatus) showStatus("");
  let r, pantry;
  try {
    [r, pantry] = await Promise.all([api(`/recipes/${id}`), api("/pantry")]);
  } catch (e) {
    showStatus(e.message, true);
    return;
  }
  const have = new Set(pantry.map((p) => matchKey(p.name)));
  const owned = r.ingredients.filter((i) => have.has(matchKey(i.name))).length;

  $("detail-body").innerHTML = `
    <div class="hero-protein"><b>${Math.round(r.protein_per_serving_g || 0)}g</b>
      <span>protein per serving, estimated</span></div>
    <h1>${esc(r.title)}</h1>
    <p class="sub">Serves ${r.servings}. You have ${owned} of ${r.ingredients.length} ingredients.</p>
    <p><a href="${esc(r.source_url)}" target="_blank" rel="noopener">Watch on TikTok</a></p>

    <h2>Ingredients</h2>
    <ul class="rows">${r.ingredients.map((i) => {
      const got = have.has(matchKey(i.name));
      const amount = fmtAmount(i.quantity, i.unit);
      return `<li class="row ${got ? "owned" : ""}">
        <span class="title"><span class="item-name">${esc(i.name)}</span>
          ${amount ? `<span class="item-meta">${esc(amount)}</span>` : ""}<br>
          <span class="item-meta">${esc(i.original || "")}</span></span>
        ${got ? `<span class="have">Have it</span>` : ""}
      </li>`;
    }).join("")}</ul>

    ${r.steps.length ? `<h2>Steps</h2><ol class="steps">${r.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}

    <div class="detail-actions">
      <button class="primary" id="cooked">Cooked it</button>
      <button class="danger" id="delete">Delete recipe</button>
    </div>`;

  $("cooked").onclick = async () => {
    try {
      const res = await api(`/recipes/${id}/cooked`, { method: "POST" });
      showStatus(res.removed.length
        ? `Cooked. Removed from your pantry: ${res.removed.join(", ")}.`
        : "Cooked. Nothing to remove, since none of these were in your pantry (staples stay).");
      openRecipe(id, true);
    } catch (e) { showStatus(e.message, true); }
  };

  $("delete").onclick = async () => {
    if (!confirm(`Delete “${r.title}”?`)) return;
    try {
      await api(`/recipes/${id}`, { method: "DELETE" });
      selected.delete(id);
      store.set("selected", [...selected]);
      showStatus(`Deleted ${r.title}.`);
      await loadRecipes();
      show("pick");
    } catch (e) { showStatus(e.message, true); }
  };

  show("detail");
}

/* ---------- Shopping list ---------- */

async function showList() {
  showStatus("");
  const ids = [...selected].sort((a, b) => a - b);
  $("make").disabled = true;
  let data;
  try {
    data = await api("/shopping-list", jsonBody("POST", { recipe_ids: ids }));
  } catch (e) {
    showStatus(e.message, true);
    updateMakeButton();
    return;
  }
  const checkedKey = "checked:" + ids.join(",");
  const checked = new Set(store.get(checkedKey, []));

  $("list-title").textContent = data.count ? `${data.count} thing${data.count > 1 ? "s" : ""} to buy` : "You have everything";
  $("list-sub").textContent = "For " + data.recipes.join(", ");
  $("aisles").innerHTML = Object.entries(data.by_aisle).map(([aisle, items]) => `
    <h2>${esc(aisle)}</h2>
    <ul class="rows">${items.map((i) => `
      <li class="${checked.has(i.name) ? "done" : ""}"><label class="row">
        <input type="checkbox" data-name="${esc(i.name)}" ${checked.has(i.name) ? "checked" : ""}>
        <span class="title"><span class="item-name">${esc(i.name)}${i.amount ? ` <span class="item-meta">${esc(i.amount)}</span>` : ""}</span><br>
          <span class="item-meta">${esc(i.recipes.join(", "))}</span></span>
      </label></li>`).join("")}
    </ul>`).join("");

  $("aisles").onchange = (e) => {
    const name = e.target.dataset.name;
    e.target.checked ? checked.add(name) : checked.delete(name);
    e.target.closest("li").classList.toggle("done", e.target.checked);
    store.set(checkedKey, [...checked]);
  };
  show("list");
}
$("make").addEventListener("click", showList);

/* ---------- Pantry ---------- */

async function loadPantry() {
  let items;
  try {
    items = await api("/pantry");
  } catch (e) {
    showStatus(e.message, true);
    return;
  }
  const row = (p) => `
    <li class="row">
      <span class="title"><span class="item-name">${esc(p.name)}</span></span>
      <span class="row-actions">
        <button class="ghost small" data-staple="${esc(p.name)}" data-to="${p.is_staple ? 0 : 1}">
          ${p.is_staple ? "Not a staple" : "Make staple"}</button>
        <button class="ghost small" data-remove="${esc(p.name)}">Remove</button>
      </span>
    </li>`;
  const staples = items.filter((p) => p.is_staple);
  const others = items.filter((p) => !p.is_staple);
  $("pantry-items").innerHTML = items.length
    ? (staples.length ? `<h2>Staples</h2><ul class="rows">${staples.map(row).join("")}</ul>` : "")
      + (others.length ? `<h2>Other items</h2><ul class="rows">${others.map(row).join("")}</ul>` : "")
    : `<div class="empty" style="margin-top:20px">Your pantry is empty. Add what you have, or use Add receipt after you shop.</div>`;
}

$("pantry-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const items = $("pantry-input").value.split(/[,\n]/).map((s) => s.trim()).filter(Boolean);
  if (!items.length) return;
  try {
    await api("/pantry", jsonBody("POST", { items, is_staple: $("pantry-staple").checked }));
    $("pantry-input").value = "";
    showStatus(`Added ${items.join(", ")}.`);
    loadPantry();
  } catch (err) { showStatus(err.message, true); }
});

$("pantry-items").addEventListener("click", async (e) => {
  const staple = e.target.closest("[data-staple]");
  const remove = e.target.closest("[data-remove]");
  try {
    if (staple) {
      await api(`/pantry/${encodeURIComponent(staple.dataset.staple)}`,
        jsonBody("PUT", { is_staple: staple.dataset.to === "1" }));
      showStatus("");
    } else if (remove) {
      await api(`/pantry/${encodeURIComponent(remove.dataset.remove)}`, { method: "DELETE" });
      showStatus(`Removed ${remove.dataset.remove}.`);
    } else return;
    loadPantry();
  } catch (err) { showStatus(err.message, true); }
});

/* ---------- Receipts ---------- */

$("upload").addEventListener("change", async (e) => {
  const files = [...e.target.files];
  e.target.value = "";
  const added = new Set();
  for (const [n, file] of files.entries()) {
    showStatus(`Reading ${files.length > 1 ? `image ${n + 1} of ${files.length}` : "your receipt"}…`);
    const form = new FormData();
    form.append("file", file);
    try {
      const res = await api("/pantry/import", { method: "POST", body: form });
      res.added.forEach((name) => added.add(name));
    } catch (err) {
      showStatus(`Couldn’t read ${file.name}: ${err.message}`, true);
      return;
    }
  }
  showStatus(added.size ? `Added to your pantry: ${[...added].join(", ")}` : "No groceries found in that image.");
});

loadRecipes();
</script>
</body>
</html>
